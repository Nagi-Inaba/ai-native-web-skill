name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report Chrome availability
        shell: bash
        run: |
          node -e "require('playwright-core').chromium.launch({channel:'chrome'}).then(b=>{console.log('chrome: available');return b.close()},()=>console.log('chrome: unavailable, browser tests will skip'))"
      - run: npm test
      - name: Distribution copies are in sync
        shell: bash
        run: |
          npm run sync
          status="$(git status --porcelain --untracked-files=all -- claude codex)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi
