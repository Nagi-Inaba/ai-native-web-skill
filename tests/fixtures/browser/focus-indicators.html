<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Focus indicators</title>
<style>
  button { outline: none; }
  #border-focus { border: 3px solid transparent; }
  #border-focus:focus { border-color: #0645d8; }
  #constant-shadow { box-shadow: 0 0 0 3px #0645d8; }
</style>
</head>
<body>
  <button id="border-focus" type="button">Border focus</button>
  <button id="constant-shadow" type="button">Constant shadow</button>
</body>
</html>
